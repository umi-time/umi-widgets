name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC Trusted Publishing
  contents: read   # Required to read repository code checkout

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npmjs.org"

      - name: Upgrade npm CLI
        run: npm i -g npm@11.15.0

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Compile and Build Package
        run: npm run build --if-present

      - name: Run Quality Verification Tests
        run: npm test

      - name: Stage Package via Trusted Publishing
        run: npm stage publish
