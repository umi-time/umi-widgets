<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umi-widgets Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #e9ecef;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <umi-clock latitude="35.14" longitude="-120.64" timezone="America/Los_Angeles" size="380px"></umi-clock>
      <span>Light Mode (Pismo Beach)</span>
    </div>
    <div class="card">
      <umi-clock latitude="69.65" longitude="18.96" timezone="Europe/Oslo" size="380px" dark="true"></umi-clock>
      <span>Dark Mode (Tromsø)</span>
    </div>

    <script src="../dist/umi-widgets.min.js"></script>
  </body>
</html>
